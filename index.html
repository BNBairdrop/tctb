<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Connect HTML Demo</title>
    <!-- Include the TonConnect UI library via CDN -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f7f6;
        }
        #ton-connect-btn {
            margin-bottom: 20px;
        }
        .info-box {
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Container where the TonConnect Button will be rendered -->
    <div id="ton-connect-btn"></div>

    <div class="info-box">
        <h3>Wallet Status</h3>
        <p id="wallet-address">Not connected</p>
    </div>

    <script>
        // Initialize TonConnectUI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://githubusercontent.com',
            buttonRootId: 'ton-connect-btn'
        });

        // Listen for wallet connection status changes
        tonConnectUI.onStatusChange(wallet => {
            const addressElement = document.getElementById('wallet-address');
            if (wallet) {
                // User connected their wallet
                const rawAddress = wallet.account.address;
                // Format address for user friendliness (e.g., 0:1234...abcd)
                const formattedAddress = rawAddress.slice(0, 6) + '...' + rawAddress.slice(-4);
                addressElement.innerText = `Connected: ${formattedAddress}`;
                console.log("Wallet info:", wallet);
            } else {
                // User disconnected
                addressElement.innerText = "Not connected";
            }
        });
    </script>
</body>
</html>
